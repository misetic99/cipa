# Sigurnosni headeri.
# Ukljucuje se u svaki blok koji ima vlastiti add_header, jer nginx
# NE nasljeđuje add_header iz roditelja cim ga blok sam definira.
add_header X-Frame-Options            "DENY"                            always;
add_header X-Content-Type-Options     "nosniff"                         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'; upgrade-insecure-requests" always;
