name: Build and Push Docker Image

on:
  push:
    tags:
      - "*"   # buildaj samo kad se napravi git tag (npr. v1.0.0)

jobs:
  docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/misetic99/cipa:${GITHUB_REF_NAME} -t ghcr.io/misetic99/cipa:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/misetic99/cipa:${GITHUB_REF_NAME}
          docker push ghcr.io/misetic99/cipa:latest
