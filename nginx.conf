# ── SB Digital Advertising — staticki site ─────────────────────────
# Ide u /etc/nginx/conf.d/default.conf.
# Radi i direktno na portu 80 i iza reverse proxyja (Traefik/Caddy/
# nginx/Cloudflare) — shema se preuzima iz X-Forwarded-Proto ako postoji.

map $http_x_forwarded_proto $fwd_scheme {
    default  $scheme;
    "~.+"    $http_x_forwarded_proto;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  sbdigitaladvertising.com www.sbdigitaladvertising.com _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # Location u redirectima neka bude relativan — inace nginx zalijepi
    # $server_port (80) pa se izgubi stvarni port/shema iza proxyja.
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    # ── www -> apex (jedan kanonski host) ──────────────────────────
    if ($host = www.sbdigitaladvertising.com) {
        return 301 $fwd_scheme://sbdigitaladvertising.com$request_uri;
    }

    # ── Kompresija ─────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml
                    application/ld+json;

    # ── 301 sa starih .html URL-ova na ciste ───────────────────────
    # /index.html se hvata preko $request_uri, a NE preko location bloka:
    # `index index.html` radi interni redirect na /index.html, pa bi
    # location = /index.html vrtio beskonacnu petlju redirecta.
    if ($request_uri ~ "^/(index|main)\.html($|\?)") {
        return 301 /;
    }

    location ~ ^/(o-nama|usluge|kontakt|privatnost|kalkulator)\.html$ {
        return 301 /$1;
    }

    # ── Health check ───────────────────────────────────────────────
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Sakrivene datoteke ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log    off;
        log_not_found off;
    }

    # ── robots / sitemap ───────────────────────────────────────────
    location = /robots.txt  { expires 1d; try_files $uri =404; }
    location = /sitemap.xml { expires 1d; try_files $uri =404; }

    # ── Statika: dugi cache ────────────────────────────────────────
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # ── Ciste URL-ove mapiraj na .html; HTML se ne kesira ──────────
    location / {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files  $uri $uri.html $uri/ =404;
    }

    # ── 404 ────────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
